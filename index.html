<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haroe 10</title>
<meta name="description" content="Designing our place: living room and kitchen in 3D">
<meta name="theme-color" content="#1F5A41">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Haroe 10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECE7; --panel:#FFFFFF; --ink:#17211C; --muted:#5C6861; --line:#D3D8D1;
  --green:#1F5A41; --yellow:#E8C91A; --chip:#F3F5F1; --label-bg:rgba(255,255,255,.92);
  --arch-top:#2E7D5A; --arch-bot:#163F2E; --on:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --panel:#19211D; --ink:#E8EEE9; --muted:#9BA9A1; --line:#2C3731;
    --green:#63C398; --yellow:#E8C91A; --chip:#222C27; --label-bg:rgba(25,33,29,.92);
    --arch-top:#3E9C71; --arch-bot:#1F5A41; --on:#0d1411;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --panel:#19211D; --ink:#E8EEE9; --muted:#9BA9A1; --line:#2C3731;
  --green:#63C398; --yellow:#E8C91A; --chip:#222C27; --label-bg:rgba(25,33,29,.92);
  --arch-top:#3E9C71; --arch-bot:#1F5A41; --on:#0d1411;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{height:100dvh}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; display:flex; flex-direction:column; overflow:hidden;
}
#stage{position:relative; flex:1 1 56%; min-height:0; touch-action:none}
#stage canvas{display:block; width:100%; height:100%}
#labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.tag{
  position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
  background:var(--label-bg); color:var(--ink); border:1px solid var(--line);
  padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600;
  transition:opacity .25s;
}
.tag.new{border-color:var(--yellow); box-shadow:inset 0 0 0 1px var(--yellow)}
.tag.dim{background:#1F5A41; color:#fff; border-color:#1F5A41}
.tag.who{background:#1F5A41; color:#fff; border-color:#1F5A41}
.tag.me{background:#E8C91A; color:#163F2E; border-color:#E8C91A}
.tag.zzz{background:transparent; border:0; font-size:17px; font-weight:800; color:#9db7dd; text-shadow:0 1px 3px rgba(0,0,0,.5); animation:zz 2.4s ease-in-out infinite}
.tag.say{background:#fff; color:#17211C; border-color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25); font-size:13px}
@keyframes zz{0%,100%{margin-top:0}50%{margin-top:-10px}}
#hint{position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted); transition:opacity .3s; pointer-events:none}
#toast{
  position:absolute; left:50%; top:14px; transform:translateX(-50%); max-width:90%;
  background:#17211C; color:#fff; padding:8px 14px; border-radius:99px; font-size:13px; font-weight:600;
  opacity:0; transition:opacity .3s; pointer-events:none; text-align:center;
}
#toast.show{opacity:.94}
#stageBtns{position:absolute; right:10px; top:calc(10px + env(safe-area-inset-top,0px)); display:flex; gap:6px; z-index:3}
.fab{font:inherit; font-size:12px; font-weight:700; color:var(--ink); background:var(--label-bg); border:1px solid var(--line); border-radius:99px; padding:6px 11px; cursor:pointer}
#rotateTip{position:absolute; left:10px; right:10px; top:48px; z-index:3; background:#E8C91A; color:#163F2E; font-size:13px; font-weight:600; padding:8px 34px 8px 12px; border-radius:12px}
#rotateTip button{position:absolute; right:6px; top:3px; border:0; background:transparent; font-size:20px; color:#163F2E; cursor:pointer; padding:2px 6px}
#pieceBar{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:3; display:flex; align-items:center; gap:6px; background:var(--label-bg); border:1px solid var(--yellow); border-radius:99px; padding:5px 6px 5px 14px; font-size:13px; white-space:nowrap}
.stick{position:absolute; bottom:calc(18px + env(safe-area-inset-bottom,0px)); width:112px; height:112px; border-radius:50%; background:rgba(23,33,28,.28); border:2px solid rgba(255,255,255,.55); touch-action:none; z-index:3; user-select:none; -webkit-user-select:none}
.stick i{position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 2px 8px rgba(0,0,0,.3); pointer-events:none}
#stickMove{left:calc(18px + env(safe-area-inset-left,0px))} #stickLook{right:calc(18px + env(safe-area-inset-right,0px))}
.stick::after{position:absolute; left:0; right:0; top:-20px; text-align:center; font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6)}
#stickMove::after{content:"WALK"} #stickLook::after{content:"LOOK"}
#guestBar{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:3; display:flex; align-items:center; gap:6px; background:var(--label-bg); border:1px solid var(--yellow); border-radius:99px; padding:5px 6px 5px 14px; font-size:13px; white-space:nowrap}
body.sticks #guestBar{bottom:140px}
#shopCard{position:absolute; left:12px; bottom:36px; z-index:3; max-width:270px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:12px 34px 12px 14px; box-shadow:0 8px 28px rgba(0,0,0,.2); display:flex; flex-direction:column; gap:5px; font-size:13px}
#shopCard b{font-size:15px} #shopCard span{color:var(--muted)} #shopCard span:empty{display:none}
#shopCard a{align-self:flex-start; margin-top:4px; background:var(--green); color:var(--on); font-weight:700; text-decoration:none; padding:7px 12px; border-radius:99px}
#shopClose{position:absolute; right:6px; top:4px; border:0; background:transparent; color:var(--muted); font-size:20px; cursor:pointer; padding:2px 6px}
body.editing #stage{outline:3px solid var(--yellow); outline-offset:-3px}
.btn[aria-pressed="true"]{background:var(--yellow); border-color:var(--yellow); color:#163F2E}
body.nomenu #panel{display:none}
body.sticks #hint{display:none}
body.sticks #pieceBar{bottom:140px}
#panel{
  flex:0 1 44%; min-height:0; overflow:auto; background:var(--panel);
  border-top:1px solid var(--line); padding:14px 16px 18px;
}
.brand{display:flex; align-items:center; gap:12px; margin:0 0 12px; padding-bottom:12px; border-bottom:1px solid var(--line)}
.brand svg{width:40px; height:40px; flex:none}
.brand h1{margin:0; font-size:24px; line-height:1; font-weight:800; letter-spacing:-.035em; display:flex; align-items:center; gap:7px}
.brand .no{
  background:linear-gradient(135deg,#FFE77A,#EBC21C 55%,#D9AA12); color:#163F2E;
  font-size:.6em; font-weight:800; letter-spacing:0; padding:4px 9px; border-radius:99px; line-height:1;
}
.brand p{margin:5px 0 0; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h2{font-size:19px; line-height:1.15; margin:0 0 4px; font-weight:700; letter-spacing:-.01em}
h3{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:16px 0 8px}
.sub{margin:0 0 10px; color:var(--muted)}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center}
.seg{display:inline-flex; background:var(--chip); border:1px solid var(--line); border-radius:10px; padding:3px}
.seg button{
  font:inherit; font-weight:600; color:var(--muted); background:transparent; border:0;
  padding:7px 14px; border-radius:7px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--green); color:var(--on)}
.seg.wide{display:flex} .seg.wide button{flex:1}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--yellow); outline-offset:2px}
.btn{
  font:inherit; font-weight:600; color:var(--ink); background:var(--chip); border:1px solid var(--line);
  padding:8px 12px; border-radius:10px; cursor:pointer; text-align:left;
}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green); color:var(--on); border-color:var(--green)}
.btn.on{border-color:var(--yellow); box-shadow:inset 0 0 0 1px var(--yellow)}
.btn:disabled{opacity:.45; cursor:default}
.acts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.acts .btn.full{grid-column:1/-1}
.check{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-weight:600; padding:0 4px}
.pal{display:flex; gap:5px; margin:0 0 12px}
.pal i{width:26px; height:14px; border-radius:99px; border:1px solid var(--line)}
ul{margin:0; padding:0; list-style:none}
li{padding:8px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:96px 1fr; gap:10px}
li b{font-weight:600}
li span{color:var(--muted)}
.note{margin:12px 0 0; font-size:13px; color:var(--muted)}
.status{margin:0 0 4px; font-weight:600}
table.rooms{width:100%; border-collapse:collapse; margin-top:8px}
table.rooms td{padding:5px 0; border-top:1px solid var(--line); vertical-align:middle}
table.rooms td:first-child{font-weight:600}
table.rooms tr.here td:first-child{color:var(--green)}
table.rooms td.sw{text-align:right; width:1%; white-space:nowrap; padding-left:6px}
.pill{font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--chip); color:var(--muted); border-radius:99px; padding:4px 10px; cursor:pointer; min-width:92px}
.pill[aria-pressed="true"]{background:var(--yellow); border-color:var(--yellow); color:#163F2E}
#modal{position:fixed; inset:0; background:rgba(10,16,13,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10}
.sheet{background:var(--panel); color:var(--ink); border-radius:18px; padding:20px; width:100%; max-width:400px; max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h2{margin-bottom:6px}
.sheet .foot{display:flex; gap:8px; justify-content:flex-end; margin-top:16px}
.stepper{display:flex; align-items:center; gap:14px; margin:10px 0 14px}
.stepper button{width:40px; height:40px; border-radius:50%; font-size:20px; text-align:center; padding:0}
.stepper output{font-size:28px; font-weight:800; min-width:1.2em; text-align:center}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font:inherit; font-weight:600; border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:99px; padding:6px 12px 6px 8px; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
.chip i{width:16px; height:16px; border-radius:50%; display:inline-block}
.chip[aria-pressed="true"]{background:var(--green); color:var(--on); border-color:var(--green)}
.assign{display:grid; grid-template-columns:auto 1fr; gap:8px 12px; align-items:center; margin-top:10px}
.assign span{font-weight:600; display:inline-flex; align-items:center; gap:7px}
.assign i{width:16px; height:16px; border-radius:50%; display:inline-block}
select{font:inherit; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:var(--chip); color:var(--ink); width:100%}
@media (min-width:860px){
  body{flex-direction:row}
  #stage{flex:1 1 auto}
  #panel{flex:0 0 384px; border-top:0; border-left:1px solid var(--line); padding:24px 22px}
  .brand{margin-bottom:16px; padding-bottom:18px}
  .brand svg{width:52px; height:52px}
  .brand h1{font-size:30px}
  h2{font-size:22px}
}
@media (orientation:landscape) and (max-height:520px){
  body{flex-direction:row}
  #stage{flex:1 1 auto}
  #panel{flex:0 0 300px; border-top:0; border-left:1px solid var(--line); padding:10px 12px}
  .brand{display:none}
  .stick{width:96px; height:96px}
}
@media (prefers-reduced-motion: reduce){.tag.zzz{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="labels"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="stageBtns">
    <button class="fab" id="bLabels" aria-pressed="false">Show labels</button>
    <button class="fab" id="bMenu" aria-pressed="true">Hide menu</button>
  </div>
  <div id="rotateTip" hidden>Tip: turn your phone sideways (rotation unlocked) for easier control. <button id="bTipClose" aria-label="Close">×</button></div>
  <div id="pieceBar" hidden><b id="pieceName"></b><button class="fab" id="bRotate">Rotate 45°</button><button class="fab" id="bPieceDone">Done</button></div>
  <div id="shopCard" hidden><button id="shopClose" aria-label="Close">×</button><b id="shopName"></b><span id="shopNote"></span><a id="shopLink" target="_blank" rel="noopener"></a></div>
  <div id="guestBar" hidden><b id="guestName"></b><button class="fab" id="bKick">Send home</button><button class="fab" id="bGuestKeep">Cancel</button></div>
  <div class="stick" id="stickMove" hidden aria-label="Move"><i></i></div>
  <div class="stick" id="stickLook" hidden aria-label="Look"><i></i></div>
  <div id="hint">Drag to rotate, pinch or scroll to zoom</div>
</div>
<aside id="panel">
  <header class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="hArch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--arch-top)"/>
          <stop offset="1" style="stop-color:var(--arch-bot)"/>
        </linearGradient>
        <linearGradient id="hGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFE77A"/><stop offset=".5" stop-color="#EBC21C"/><stop offset="1" stop-color="#C99A0E"/>
        </linearGradient>
        <radialGradient id="hMirror" cx=".35" cy=".3" r=".8">
          <stop offset="0" stop-color="#F6F0E2" stop-opacity=".35"/><stop offset="1" stop-color="#F6F0E2" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path d="M8 60V30a24 24 0 0 1 48 0v30z" fill="url(#hArch)"/>
      <path d="M13 55V30a19 19 0 0 1 38 0v25" fill="none" stroke="#F6F0E2" stroke-opacity=".22" stroke-width="1.2"/>
      <path d="M13 55h38" stroke="#F6F0E2" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M16.25 55V33.5a4.5 4.5 0 0 1 9 0V55z" fill="#F6F0E2"/>
      <circle cx="23.6" cy="44" r="1" fill="#1F5A41"/>
      <circle cx="38" cy="45.25" r="7.75" fill="url(#hMirror)" stroke="url(#hGold)" stroke-width="4"/>
    </svg>
    <div>
      <h1>Haroe <span class="no">10</span></h1>
      <p>Designing our place</p>
    </div>
  </header>
  <div class="seg wide" role="group" aria-label="Mode" style="margin-bottom:14px">
    <button id="tabDesign" aria-pressed="true">Design</button>
    <button id="tabSims" aria-pressed="false">Sims mode</button>
  </div>

  <section id="pDesign">
    <div class="seg wide" role="group" aria-label="Current or proposed" style="margin-bottom:8px">
      <button id="d_now" aria-pressed="false">Current state</button>
      <button id="d_new" aria-pressed="true">Proposals</button>
    </div>
    <div class="seg wide" role="group" aria-label="Proposal" id="segABC" style="margin-bottom:12px">
      <button id="d_a" aria-pressed="true">Option A</button>
      <button id="d_b" aria-pressed="false">Option B</button>
      <button id="d_c" aria-pressed="false">Option C</button>
    </div>
    <h2 id="dTitle"></h2>
    <p class="sub" id="dSub"></p>
    <div class="pal" id="dPal" aria-hidden="true"></div>
    <div class="row">
      <button class="btn primary" id="bTable"></button>
      <button class="btn" id="bLift" hidden></button>
      <button class="btn" id="bEdit" aria-pressed="false">Edit layout</button>
      <button class="btn" id="bResetMoves" hidden>Put furniture back</button>
    </div>
    <p class="note" id="editNote" style="margin:-4px 0 12px"></p>
    <div class="row">
      <div class="seg" role="group" aria-label="View">
        <button id="b3d" aria-pressed="true">3D</button>
        <button id="bTop" aria-pressed="false">From above</button>
      </div>
      <label class="check"><input type="checkbox" id="cLabels"> Labels</label>
      <label class="check"><input type="checkbox" id="cCut"> Cut walls low</label>
      <label class="check"><input type="checkbox" id="cDims"> Dimensions</label>
    </div>
    <ul id="list"></ul>
    <p class="note" id="note"></p>
  </section>

  <section id="pSims" hidden>
    <div class="row">
      <div class="seg" role="group" aria-label="Who are you">
        <button id="whoAngela" aria-pressed="true">Angela</button>
        <button id="whoYoav" aria-pressed="false">Yoav</button>
      </div>
      <div class="seg" role="group" aria-label="Time of day">
        <button id="tDay" aria-pressed="true">Day</button>
        <button id="tEve" aria-pressed="false">Evening</button>
      </div>
      <div class="seg" role="group" aria-label="Camera">
        <button id="camFollow" aria-pressed="true">Follow</button>
        <button id="camEye" aria-pressed="false">Eye view</button>
      </div>
    </div>
    <p class="status" id="status"></p>
    <p class="note" style="margin-top:0">Tap the floor to walk there.</p>
    <h3>Do</h3>
    <div class="acts" id="acts"></div>
    <h3>Friends</h3>
    <div class="acts" id="social"></div>
    <h3>Lights and shutters</h3>
    <label class="check"><input type="checkbox" id="cAuto"> Switch lights as I enter and leave a room</label>
    <table class="rooms" id="roomsTbl"></table>
  </section>
</aside>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="app/core.js"></script>
<script src="app/kit.js"></script>
<script src="app/house.js"></script>
<script src="app/furniture.js"></script>
<script src="app/sims.js"></script>
</body>
</html>
